<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Blooming Collects 🌼 a garden of random projects</title>
  <meta name="description" content="A playful garden of experiments, toys, and half-baked ideas." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌼</text></svg>" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="petals" aria-hidden="true"></div>
  <header class="hero">
    <div class="logo" id="logo" title="click me!">🌼</div>
    <h1>Blooming <span class="wiggle">Collects</span></h1>
    <p class="tagline">A little garden where random projects sprout. Some bloom, some wilt, all are fun.</p>
    <div class="buttons">
      <button id="surprise" class="btn btn-pink">🎲 Surprise me</button>
      <a href="#garden" class="btn btn-yellow">🌱 See the garden</a>
    </div>
  </header>
  <main id="garden">
    <h2>The Garden <small id="count"></small></h2>
    <div class="filters" id="filters"></div>
    <div class="grid" id="grid"></div>
  </main>
  <footer>
    <p>Planted with 💛 by Mushi · <span id="year"></span></p>
    <p class="tiny">psst: try the Konami code ⬆⬆⬇⬇⬅➡⬅➡BA</p>
  </footer>
  <script src="/projects.js"></script>
  <script src="/script.js"></script>
</body>
</html>
