<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Bay Area Trip · Oct 31 – Nov 3</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root { --ink:#2d2a3e; --muted:#6f6a85; --line:rgba(45,42,62,.12); --deep:#e2729c; --paper:#fbf9fc; }
    * { box-sizing:border-box; }
    html, body { margin:0; height:100%; }
    body { color:var(--ink); font-family:"Zen Maru Gothic",system-ui,sans-serif; background:var(--paper); display:flex; flex-direction:column; }
    header { padding:.7rem 1rem; background:linear-gradient(100deg,#a7d4ff,#fbe3ee 60%,#ffe9c7); display:flex; align-items:center; gap:.9rem; flex-wrap:wrap; border-bottom:1px solid var(--line); }
    header a.back { color:var(--muted); text-decoration:none; font-size:.85rem; }
    header h1 { margin:0; font-size:1.2rem; }
    .count { background:rgba(255,255,255,.75); border-radius:999px; padding:.25rem .8rem; font-size:.85rem; font-weight:700; }
    .hbtn { margin-left:auto; display:flex; gap:.4rem; }
    .hbtn button, .chipbtn { border:1px solid var(--line); background:#fff; border-radius:999px; padding:.3rem .75rem; font:inherit; font-size:.82rem; cursor:pointer; color:var(--ink); }
    .hbtn button.on { background:var(--ink); color:#fff; }
    .app { flex:1; display:grid; grid-template-columns:440px 1fr; min-height:0; }
    aside { display:flex; flex-direction:column; min-height:0; border-right:1px solid var(--line); background:#fff; }
    .tabs { display:flex; gap:.35rem; padding:.6rem .8rem; overflow-x:auto; border-bottom:1px solid var(--line); }
    .tabs button { border:1px solid var(--line); background:#fff; color:var(--ink); border-radius:999px; padding:.32rem .75rem; cursor:pointer; white-space:nowrap; font:inherit; font-size:.83rem; }
    .tabs button.on { color:#fff; border-color:transparent; }
    .tools { display:flex; gap:.4rem; padding:.5rem .8rem; border-bottom:1px solid var(--line); align-items:center; }
    .tools input { flex:1; font:inherit; padding:.42rem .7rem; border:1px solid var(--line); border-radius:10px; min-width:0; }
    .prog { font-size:.78rem; color:var(--muted); padding:.35rem .8rem 0; display:flex; justify-content:space-between; }
    .bar { height:6px; background:#f0e9f4; border-radius:99px; margin:.3rem .8rem .2rem; overflow:hidden; } .bar i { display:block; height:100%; background:linear-gradient(90deg,#f6a9c6,#e2729c); transition:width .3s; }
    .list { overflow-y:auto; padding:.3rem .8rem 3rem; flex:1; }
    .dayhead { margin:1rem 0 .3rem; display:flex; align-items:center; gap:.5rem; flex-wrap:wrap; }
    .dayhead h2 { margin:0; font-size:1.05rem; } .dayhead .sub { color:var(--muted); font-size:.82rem; }
    .wx { margin-left:auto; font-size:.8rem; background:#eef6ff; border-radius:999px; padding:.15rem .6rem; }
    .dot { width:12px; height:12px; border-radius:50%; display:inline-block; }
    .note { background:#f6f3fb; border-radius:10px; padding:.45rem .7rem; font-size:.84rem; margin:.3rem 0; color:#4a4560; }
    .opt { display:grid; grid-template-columns:1fr 1fr; gap:.4rem; margin:.3rem 0; } .opt div { background:#eef6ff; border-radius:10px; padding:.4rem .6rem; font-size:.8rem; }
    .place { display:flex; gap:.55rem; align-items:flex-start; padding:.5rem .45rem; border-radius:12px; cursor:pointer; border:1px solid transparent; transition:background .15s; }
    .place:hover { background:#faf7fd; } .place.sel { border-color:var(--deep); background:#fdf3f7; }
    .place.next { box-shadow:inset 3px 0 0 #74cfac; }
    .num { flex:none; width:26px; height:26px; border-radius:50%; color:#fff; font-size:.78rem; font-weight:700; display:grid; place-items:center; margin-top:.1rem; }
    .num.nomap { background:#c9c4d6 !important; }
    .pbody { flex:1; min-width:0; } .pname { font-weight:700; } .pdesc { color:var(--muted); font-size:.83rem; }
    .time { font-size:.75rem; color:#3a6fae; font-weight:700; margin-right:.3rem; }
    .tags { margin-top:.2rem; display:flex; flex-wrap:wrap; gap:.25rem; } .tag { font-size:.68rem; background:#f0edf6; color:#5f5880; border-radius:999px; padding:.05rem .5rem; }
    .acts { display:flex; flex-direction:column; align-items:flex-end; gap:.2rem; }
    .acts a, .acts button, .acts select { font-size:.72rem; color:#3a6fae; text-decoration:none; white-space:nowrap; background:none; border:0; cursor:pointer; padding:0; font-family:inherit; }
    .acts input[type=checkbox] { width:18px; height:18px; accent-color:var(--deep); }
    .heart { font-size:1rem !important; line-height:1; }
    .place.done .pname { text-decoration:line-through; color:var(--muted); }
    .drive { font-size:.74rem; color:var(--muted); padding:.05rem 0 .05rem 2.6rem; }
    .tl .place { position:relative; } .tl .place::before { content:""; position:absolute; left:20px; top:34px; bottom:-14px; width:2px; background:#ece6f3; }
    .addform { background:#faf7fd; border:1px dashed #d7cde8; border-radius:12px; padding:.6rem; margin:.8rem 0; display:none; }
    .addform.show { display:block; }
    .addform input, .addform select { font:inherit; font-size:.85rem; padding:.4rem .55rem; border:1px solid var(--line); border-radius:8px; width:100%; margin:.2rem 0; }
    .addform .row { display:flex; gap:.4rem; } .addform button { border:0; background:var(--deep); color:#fff; border-radius:999px; padding:.4rem .9rem; font:inherit; cursor:pointer; }
    .msg { font-size:.78rem; color:var(--muted); }
    #map { height:100%; min-height:300px; }
    .pin { width:28px; height:28px; border-radius:50% 50% 50% 0; transform:rotate(-45deg); display:grid; place-items:center; border:2px solid #fff; box-shadow:0 2px 6px rgba(0,0,0,.25); }
    .pin b { transform:rotate(45deg); color:#fff; font-size:.74rem; font-family:system-ui; }
    .pin.fav { outline:3px solid #ffd166; }
    .toast { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:.5rem 1rem; border-radius:999px; font-size:.85rem; opacity:0; transition:opacity .3s; pointer-events:none; z-index:9999; }
    .toast.show { opacity:1; }
    @media (max-width:860px){ .app { grid-template-columns:1fr; grid-template-rows:40vh 1fr; } #mapwrap { order:-1; } aside { border-right:0; border-top:1px solid var(--line); } .hbtn { margin-left:0; } }
  </style>
</head>
<body>
<header>
  <a class="back" href="/">← garden</a>
  <h1>🌉 Bay Area: SJ + SF</h1>
  <span class="count" id="count"></span>
  <div class="hbtn">
    <button id="vList" class="on">📋 List</button>
    <button id="vTl">🕒 Timeline</button>
    <button id="share">🔗 Share</button>
  </div>
</header>
<div class="app">
  <aside>
    <div class="tabs" id="tabs"></div>
    <div class="tools">
      <input id="q" placeholder="Search… (boba, museum, dumplings)" />
      <button class="chipbtn" id="favf">❤️ Favs</button>
      <button class="chipbtn" id="addb">＋ Add</button>
    </div>
    <div class="prog"><span id="progt"></span><span id="nextt"></span></div>
    <div class="bar"><i id="bar"></i></div>
    <div class="list" id="list">
    </div>
  </aside>
  <div id="mapwrap"><div id="map"></div></div>
</div>
<div class="toast" id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const TRIP_START=new Date("2026-10-31T00:00:00-07:00");
const DAYS=[
 {id:"sat",date:"2026-10-31",label:"Sat 10/31",title:"Halloween · maybe drive up",color:"#f2a65a",city:"sj",
  notes:["Optional early start. If you drive up today, grab Chinese food on the way.","🎃 Halloween night idea: Winchester Mystery House Halloween tour (book early)."],places:[]},
 {id:"sun",date:"2026-11-01",label:"Sun 11/1",title:"Explore San Jose",color:"#4fbf96",city:"sj",
  opts:[["✈️ Fly","LGB → SJC, ~1h15m, arrive 11–12"],["🚗 Drive","Leave ~5 AM, arrive 11–12"]],notes:[],
  places:[
   {n:"San Jose Mineta Airport (SJC)",d:"Land",tm:"11:30",ll:[37.3639,-121.9289],t:["travel"]},
   {n:"Winchester Mystery House",d:"Spooky mansion tour, ~1–1.5 hrs",tm:"1:00",ll:[37.3184,-121.9511],t:["attraction","spooky"]},
   {n:"Santana Row",d:"Shopping, boba & dessert across the street",tm:"2:45",ll:[37.3209,-121.9478],t:["walk","shopping"]},
   {n:"Hakone Gardens",d:"Japanese garden · Saratoga (~25 min)",tm:"4:00",ll:[37.2486,-122.0436],t:["garden"]},
   {n:"Spina Farms Pumpkin Patch",d:"Dinosaur pumpkin patch · confirm open Nov 1",tm:"",ll:[37.1913,-121.7292],t:["halloween"],warn:1},
   {n:"Daeho Kalbijjim",d:"Dinner: galbijjim · pick the nearest location",tm:"6:30",ll:null,t:["dinner","korean"]},
   {n:"Karaoke on El Camino Real",d:"Noraebang + Korean BBQ strip",tm:"8:30",ll:[37.3525,-121.9805],t:["night","activity"]}]},
 {id:"mon",date:"2026-11-02",label:"Mon 11/2",title:"San Francisco day",color:"#e2729c",city:"sf",
  notes:["Many SF museums close on Mondays, so check hours for indoor stops."],
  places:[
   {n:"Stan's Donut Shop",d:"TikTok glazed donuts · Santa Clara, grab on the way up",tm:"7:30",ll:[37.3474,-121.9727],t:["sweets"]},
   {n:"Kasamba Coffee",d:"Coffee",tm:"",ll:null,t:["coffee"]},
   {n:"Dumpling Home",d:"Breakfast: soup dumplings (Michelin-recognized)",tm:"9:30",ll:[37.7744,-122.4235],t:["breakfast"]},
   {n:"Alamo Square · Painted Ladies",d:"Photo stop",tm:"10:30",ll:[37.7764,-122.4346],t:["walk","photo"]},
   {n:"Blue Heron paddle boats · Stow Lake",d:"Golden Gate Park, really fun",tm:"11:15",ll:[37.7713,-122.4761],t:["activity"]},
   {n:"Japanese Tea Garden",d:"Next to Stow Lake",tm:"12:15",ll:[37.7701,-122.4703],t:["garden"]},
   {n:"Palace Games escape room",d:"Palace of Fine Arts · book ahead",tm:"1:30",ll:[37.8029,-122.4484],t:["activity"],link:"https://palace-games.com/"},
   {n:"Crissy Field",d:"Golden Gate Bridge view (Wave Organ & Fort Point nearby)",tm:"3:00",ll:[37.8039,-122.4641],t:["walk","photo"]},
   {n:"Ghirardelli Square",d:"Sundae stop",tm:"4:00",ll:[37.8059,-122.4229],t:["sweets"]},
   {n:"Musée Mécanique",d:"Vintage arcade games for quarters",tm:"4:30",ll:[37.8094,-122.4160],t:["activity","quirky"]},
   {n:"Boudin Bakery",d:"Clam chowder bread bowl",tm:"5:00",ll:[37.8083,-122.4148],t:["food"]},
   {n:"PIER 39",d:"Sea lions & waterfront",tm:"5:30",ll:[37.8087,-122.4098],t:["attraction"]},
   {n:"Golden Gate Bakery",d:"Chinatown egg tarts · hours vary",tm:"6:15",ll:[37.7964,-122.4073],t:["sweets"],warn:1},
   {n:"Golden Gate Fortune Cookie Factory",d:"Chinatown",tm:"6:30",ll:[37.7963,-122.4068],t:["sweets"]},
   {n:"Japan Center Malls",d:"Japantown shopping",tm:"7:00",ll:[37.7853,-122.4294],t:["shopping"]},
   {n:"Marufuku Ramen",d:"Dinner: tonkotsu ramen",tm:"7:45",ll:[37.7852,-122.4313],t:["dinner"]},
   {n:"Día de los Muertos · Mission",d:"Evening procession & altars (check details)",tm:"",ll:[37.7526,-122.4120],t:["event"]}]},
 {id:"tue",date:"2026-11-03",label:"Tue 11/3",title:"Brunch & head home",color:"#ad98ea",city:"sj",
  opts:[["✈️ Fly","SJC → LGB, any time"],["🚗 Drive","Leave ~12 PM, home ~9 PM"]],notes:[],
  places:[
   {n:"New coffee spot next to Nam's",d:"Morning coffee",tm:"9:00",ll:null,t:["coffee"]},
   {n:"Dim sum brunch",d:"Kelly's pick",tm:"10:00",ll:null,t:["brunch"]},
   {n:"Rosicrucian Egyptian Museum + Rose Garden",d:"Optional: mummies & a free garden",tm:"11:30",ll:[37.3333,-121.9234],t:["museum"]}]},
 {id:"ideas",label:"💡 Ideas",title:"Not scheduled yet · move any to a day",color:"#7aaee8",notes:[],
  places:[
   {n:"Bike the Golden Gate Bridge",d:"E-bikes to Sausalito, ferry back",ll:[37.8199,-122.4783],t:["activity"]},
   {n:"Alcatraz",d:"Book ASAP, usually sells out",ll:[37.8267,-122.4230],t:["attraction"]},
   {n:"Cable car (Powell-Hyde)",d:"Classic ride to Ghirardelli",ll:[37.7846,-122.4078],t:["activity"]},
   {n:"Lands End + Sutro Baths",d:"Ocean cliffs, ruins, sunset",ll:[37.7805,-122.5113],t:["walk"]},
   {n:"Hayes Valley",d:"Boutiques & coffee near Dumpling Home",ll:[37.7766,-122.4241],t:["walk"]},
   {n:"Haight-Ashbury",d:"Vintage shops & murals",ll:[37.7692,-122.4481],t:["walk"]},
   {n:"Good Mong Kok Bakery",d:"Takeout dim sum, Chinatown",ll:[37.7955,-122.4071],t:["food"]},
   {n:"La Taqueria",d:"Famous Mission burritos",ll:[37.7509,-122.4181],t:["food"]},
   {n:"House of Prime Rib",d:"Classic SF dinner, reserve",ll:[37.7932,-122.4224],t:["dinner"]},
   {n:"Downtown Los Gatos",d:"Cute main street, ~20 min",ll:[37.2266,-121.9802],t:["walk"]},
   {n:"Apple Park Visitor Center",d:"Rooftop view of the 'spaceship'",ll:[37.3327,-122.0053],t:["tech"]},
   {n:"Castro St, Mountain View",d:"Boba & Asian food street",ll:[37.3937,-122.0790],t:["food","walk"]},
   {n:"Vietnamese breakfast · Story Rd",d:"SJ Little Saigon: pho, bánh mì, cà phê",ll:[37.3305,-121.8605],t:["breakfast"]},
   {n:"The Mystery Spot",d:"Gravity-defying, Santa Cruz (~40 min)",ll:[37.0170,-122.0024],t:["quirky"]},
   {n:"Sharks Ice San Jose",d:"Public ice skating",ll:[37.3097,-121.8719],t:["activity"]},
   {n:"San Pedro Square Market",d:"Downtown SJ food hall",ll:[37.3364,-121.8941],t:["food"]}]},
];
const DAYIDS=["sat","sun","mon","tue"];
const ALL={id:"all",label:"All days",color:"#2d2a3e"};
const S={get:(k,d)=>{try{return JSON.parse(localStorage.getItem("t3_"+k))??d}catch{return d}},set:(k,v)=>localStorage.setItem("t3_"+k,JSON.stringify(v))};
let cur=S.get("tab","all"), view=S.get("view","list"), query="", favOnly=false;
let done=S.get("done",{}), favs=S.get("favs",{}), moved=S.get("moved",{}), custom=S.get("custom",[]);
const pid=p=>p.id||p.n;
function placesFor(dayId){
  let base=[];
  if(dayId==="ideas"){ base=DAYS.find(d=>d.id==="ideas").places.filter(p=>!moved[pid(p)]); }
  else { base=[...DAYS.find(d=>d.id===dayId).places, ...DAYS.find(d=>d.id==="ideas").places.filter(p=>moved[pid(p)]===dayId).map(p=>({...p,movedIn:1}))]; }
  return [...base, ...custom.filter(c=>c.day===dayId)];
}
/* map */
const map=L.map("map").setView([37.55,-122.2],9);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(map);
const layer=L.layerGroup().addTo(map);
const gmaps=n=>"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(n+" Bay Area CA");
const pin=(c,n,f)=>L.divIcon({className:"",html:`<div class="pin ${f?"fav":""}" style="background:${c}"><b>${n}</b></div>`,iconSize:[28,28],iconAnchor:[14,28],popupAnchor:[0,-26]});
const km=(a,b)=>{const R=6371,r=x=>x*Math.PI/180,dLat=r(b[0]-a[0]),dLon=r(b[1]-a[1]);const h=Math.sin(dLat/2)**2+Math.cos(r(a[0]))*Math.cos(r(b[0]))*Math.sin(dLon/2)**2;return 2*R*Math.asin(Math.sqrt(h));};
const driveMin=(a,b)=>{const d=km(a,b)*1.35; return d<1.2?{t:Math.max(3,Math.round(d/0.08)),w:"🚶"}:{t:Math.max(5,Math.round(d/0.6+4)),w:"🚗"};};
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1800);}
/* header countdown */
(function(){const el=document.getElementById("count");const now=new Date();const diff=Math.ceil((TRIP_START-now)/86400000);
 el.textContent=diff>0?`⏳ ${diff} day${diff>1?"s":""} to go`:(diff>-4?"🎉 Trip in progress!":"✅ Trip done");})();
/* weather (Open-Meteo, free) */
let WX={};
function wxIcon(c){return c===0?"☀️":c<=2?"🌤️":c===3?"☁️":c<=48?"🌫️":c<=67?"🌧️":c<=77?"🌨️":c<=82?"🌦️":"⛈️";}
async function loadWx(){
  const q=(lat,lon)=>fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&daily=weathercode,temperature_2m_max,temperature_2m_min,precipitation_probability_max&temperature_unit=fahrenheit&timezone=America/Los_Angeles&start_date=2026-10-31&end_date=2026-11-03`).then(r=>r.json());
  try{const [sj,sf]=await Promise.all([q(37.335,-121.893),q(37.7749,-122.4194)]);
    DAYS.forEach(d=>{if(!d.date)return;const src=d.city==="sf"?sf:sj;const i=(src.daily?.time||[]).indexOf(d.date);if(i<0)return;
      WX[d.id]=`${wxIcon(src.daily.weathercode[i])} ${Math.round(src.daily.temperature_2m_max[i])}°/${Math.round(src.daily.temperature_2m_min[i])}° · ${src.daily.precipitation_probability_max[i]??0}% rain`;});
    render(false);}catch(e){}
}
/* UI */
function tabs(){const el=document.getElementById("tabs");el.innerHTML="";
  [ALL,...DAYS].forEach(d=>{const b=document.createElement("button");b.textContent=d.label;if(d.id===cur){b.className="on";b.style.background=d.color;}
    b.onclick=()=>{cur=d.id;S.set("tab",cur);render();};el.appendChild(b);});}
function render(fit=true){
  tabs(); layer.clearLayers();
  document.getElementById("vList").classList.toggle("on",view==="list"); document.getElementById("vTl").classList.toggle("on",view==="tl");
  const list=document.getElementById("list"); list.className="list"+(view==="tl"?" tl":""); list.innerHTML="";
  const days=cur==="all"?DAYS.filter(d=>d.id!=="ideas"):DAYS.filter(d=>d.id===cur);
  const bounds=[]; let tot=0,dn=0,nextName="";
  days.forEach(d=>{
    list.insertAdjacentHTML("beforeend",`<div class="dayhead"><span class="dot" style="background:${d.color}"></span><h2>${d.label}</h2><span class="sub">${d.title}</span>${WX[d.id]?`<span class="wx">${WX[d.id]}</span>`:""}</div>`);
    if(d.opts&&!query) list.insertAdjacentHTML("beforeend",`<div class="opt">${d.opts.map(o=>`<div><b>${o[0]}</b><br>${o[1]}</div>`).join("")}</div>`);
    if(!query&&!favOnly) d.notes.forEach(n=>list.insertAdjacentHTML("beforeend",`<div class="note">${n}</div>`));
    const route=[]; let num=0, prevLL=null, firstOpenMarked=false;
    placesFor(d.id).forEach(p=>{
      const id=pid(p), txt=(p.n+" "+p.d+" "+(p.t||[]).join(" ")).toLowerCase();
      if(query&&!txt.includes(query)) return; if(favOnly&&!favs[id]) return;
      tot++; const isDone=!!done[id]; if(isDone) dn++;
      if(view==="tl"&&prevLL&&p.ll){const m=driveMin(prevLL,p.ll);list.insertAdjacentHTML("beforeend",`<div class="drive">${m.w} ~${m.t} min</div>`);}
      const label=p.ll?++num:"•";
      const row=document.createElement("div"); row.className="place"+(isDone?" done":"");
      if(!isDone&&!firstOpenMarked&&d.id!=="ideas"){firstOpenMarked=true; if(!nextName) nextName=p.n; row.classList.add("next");}
      const moveSel=d.id==="ideas"?`<select title="Move to a day"><option value="">＋ to day…</option>${DAYIDS.map(x=>`<option value="${x}">${DAYS.find(z=>z.id===x).label}</option>`).join("")}</select>`
        :(p.movedIn?`<button data-a="unmove">↩ to ideas</button>`:(p.custom?`<button data-a="del">✕ remove</button>`:""));
      row.innerHTML=`<div class="num ${p.ll?"":"nomap"}" style="background:${d.color}">${label}</div>
        <div class="pbody"><div class="pname">${view==="tl"&&p.tm?`<span class="time">${p.tm}</span>`:""}${p.n}</div><div class="pdesc">${p.warn?"⚠️ ":""}${p.d||""}</div>
        <div class="tags">${(p.t||[]).map(t=>`<span class="tag">${t}</span>`).join("")}${p.movedIn?'<span class="tag">moved in</span>':""}${p.custom?'<span class="tag">added by you</span>':""}</div></div>
        <div class="acts"><input type="checkbox" ${isDone?"checked":""} title="Done"><button class="heart" data-a="fav">${favs[id]?"❤️":"🤍"}</button>
        <a href="${p.link||gmaps(p.n)}" target="_blank" rel="noopener">${p.link?"site ↗":"maps ↗"}</a>${moveSel}</div>`;
      row.querySelectorAll(".acts *").forEach(e=>e.addEventListener("click",ev=>ev.stopPropagation()));
      row.querySelector("input").onchange=e=>{done[id]=e.target.checked;S.set("done",done);if(e.target.checked)toast("✔ "+p.n);render(false);};
      row.querySelector('[data-a="fav"]').onclick=e=>{e.stopPropagation();favs[id]=!favs[id];S.set("favs",favs);render(false);};
      const sel=row.querySelector("select"); if(sel) sel.onchange=()=>{if(!sel.value)return;moved[id]=sel.value;S.set("moved",moved);toast(`Moved to ${DAYS.find(z=>z.id===sel.value).label}`);render(false);};
      const um=row.querySelector('[data-a="unmove"]'); if(um) um.onclick=e=>{e.stopPropagation();delete moved[id];S.set("moved",moved);render(false);};
      const de=row.querySelector('[data-a="del"]'); if(de) de.onclick=e=>{e.stopPropagation();custom=custom.filter(c=>c.id!==p.id);S.set("custom",custom);render(false);};
      if(p.ll){
        const m=L.marker(p.ll,{icon:pin(d.color,label,favs[id])}).bindPopup(`<b>${p.n}</b><br>${p.d||""}<br><a href="${gmaps(p.n)}" target="_blank">Google Maps ↗</a>`).addTo(layer);
        bounds.push(p.ll); route.push(p.ll); prevLL=p.ll;
        m.on("click",()=>{document.querySelectorAll(".place").forEach(x=>x.classList.remove("sel"));row.classList.add("sel");row.scrollIntoView({block:"nearest",behavior:"smooth"});});
        row.onclick=()=>{document.querySelectorAll(".place").forEach(x=>x.classList.remove("sel"));row.classList.add("sel");map.flyTo(p.ll,15,{duration:.8});m.openPopup();};
      }
      list.appendChild(row);
    });
    if(route.length>1&&d.id!=="ideas") L.polyline(route,{color:d.color,weight:3,opacity:.55,dashArray:"6 6"}).addTo(layer);
  });
  /* add form */
  list.insertAdjacentHTML("beforeend",`<div class="addform ${S.get("formOpen",false)?"show":""}" id="addform"><b>＋ Add your own place</b>
    <input id="fn" placeholder="Place name (e.g. Boba Guys Santana Row)"><input id="fd" placeholder="Note (optional)">
    <div class="row"><select id="fday">${[...DAYIDS,"ideas"].map(x=>`<option value="${x}" ${x===(cur==="all"?"sun":cur)?"selected":""}>${DAYS.find(z=>z.id===x).label}</option>`).join("")}</select><button id="fadd">Add</button></div>
    <div class="msg" id="fmsg">I'll look up the spot and drop a pin.</div></div>`);
  document.getElementById("fadd").onclick=addPlace;
  document.getElementById("progt").textContent=tot?`✔ ${dn} of ${tot} done`:"No matches";
  document.getElementById("nextt").textContent=nextName?`Next: ${nextName}`:"";
  document.getElementById("bar").style.width=(tot?dn/tot*100:0)+"%";
  if(fit&&bounds.length) map.fitBounds(bounds,{padding:[40,40],maxZoom:13});
  setTimeout(()=>map.invalidateSize(),50);
}
async function addPlace(){
  const n=document.getElementById("fn").value.trim(), d=document.getElementById("fd").value.trim(), day=document.getElementById("fday").value, msg=document.getElementById("fmsg");
  if(!n){msg.textContent="Type a place name first.";return;}
  msg.textContent="Looking it up…"; let ll=null;
  try{const r=await fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&viewbox=-122.6,37.95,-121.6,36.9&bounded=1&q="+encodeURIComponent(n)).then(r=>r.json()); if(r[0]) ll=[+r[0].lat,+r[0].lon];}catch(e){}
  custom.push({id:"c"+Date.now(),n,d:d||(ll?"":"Couldn't find it on the map, so it's listed without a pin"),ll,t:["custom"],day,custom:1}); S.set("custom",custom);
  toast(ll?"📍 Added with a pin":"Added (no pin found)"); cur=day; S.set("tab",cur); render();
}
document.getElementById("q").oninput=e=>{query=e.target.value.trim().toLowerCase();render();};
document.getElementById("favf").onclick=e=>{favOnly=!favOnly;e.target.classList.toggle("on",favOnly);e.target.style.background=favOnly?"#ffe3ec":"#fff";render();};
document.getElementById("addb").onclick=()=>{const open=!S.get("formOpen",false);S.set("formOpen",open);render(false);if(open)setTimeout(()=>{const f=document.getElementById("addform");f.scrollIntoView({behavior:"smooth"});document.getElementById("fn").focus();},60);};
document.getElementById("vList").onclick=()=>{view="list";S.set("view",view);render(false);};
document.getElementById("vTl").onclick=()=>{view="tl";S.set("view",view);render(false);};
document.getElementById("share").onclick=async()=>{const url=location.href.split("?")[0];
  try{if(navigator.share){await navigator.share({title:"Bay Area trip",url});}else{await navigator.clipboard.writeText(url);toast("🔗 Link copied");}}catch(e){}};
/* during the trip, open today's tab automatically */
(function(){const today=new Date().toLocaleDateString("en-CA",{timeZone:"America/Los_Angeles"});const d=DAYS.find(x=>x.date===today);if(d){cur=d.id;}})();
render(); loadWx();
</script>
