<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Bay Area Trip · Oct 31 – Nov 3</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root { --ink:#2d2a3e; --muted:#6f6a85; --line:rgba(45,42,62,.12); --deep:#e2729c; --paper:#fbf9fc; --r:14px; }
    * { box-sizing:border-box; }
    html, body { margin:0; height:100%; }
    body { color:var(--ink); font-family:"Zen Maru Gothic",system-ui,sans-serif; background:var(--paper); display:flex; flex-direction:column; }
    header { padding:.8rem 1.1rem; border-bottom:1px solid var(--line); background:linear-gradient(90deg,#cfe7ff,#fbe3ee); display:flex; align-items:center; gap:1rem; flex-wrap:wrap; }
    header a { color:var(--muted); text-decoration:none; font-size:.85rem; }
    header h1 { margin:0; font-size:1.25rem; }
    header .meta { color:var(--muted); font-size:.85rem; }
    .app { flex:1; display:grid; grid-template-columns:420px 1fr; min-height:0; }
    aside { display:flex; flex-direction:column; min-height:0; border-right:1px solid var(--line); background:#fff; }
    .tabs { display:flex; gap:.35rem; padding:.7rem .8rem; overflow-x:auto; border-bottom:1px solid var(--line); }
    .tabs button { border:1px solid var(--line); background:#fff; color:var(--ink); border-radius:999px; padding:.35rem .8rem; cursor:pointer; white-space:nowrap; font:inherit; font-size:.85rem; }
    .tabs button.on { color:#fff; border-color:transparent; }
    .search { padding:.5rem .8rem; border-bottom:1px solid var(--line); }
    .search input { width:100%; font:inherit; padding:.45rem .7rem; border:1px solid var(--line); border-radius:10px; }
    .list { overflow-y:auto; padding:.4rem .8rem 2rem; flex:1; }
    .dayhead { margin:1rem 0 .3rem; display:flex; align-items:baseline; gap:.5rem; }
    .dayhead h2 { margin:0; font-size:1.05rem; } .dayhead span { color:var(--muted); font-size:.82rem; }
    .dot { width:12px; height:12px; border-radius:50%; display:inline-block; }
    .note { background:#f6f3fb; border-radius:10px; padding:.5rem .7rem; font-size:.85rem; margin:.35rem 0; color:#4a4560; }
    .warn { background:#fff7ea; border:1px solid #f6dcae; }
    .place { display:flex; gap:.6rem; align-items:flex-start; padding:.55rem .5rem; border-radius:12px; cursor:pointer; border:1px solid transparent; }
    .place:hover { background:#faf7fd; } .place.sel { border-color:var(--deep); background:#fdf3f7; }
    .num { flex:none; width:26px; height:26px; border-radius:50%; color:#fff; font-size:.8rem; font-weight:700; display:grid; place-items:center; margin-top:.1rem; }
    .num.nomap { background:#c9c4d6 !important; }
    .pbody { flex:1; min-width:0; }
    .pname { font-weight:700; } .pdesc { color:var(--muted); font-size:.85rem; }
    .tags { margin-top:.2rem; } .tag { font-size:.7rem; background:#f0edf6; color:#5f5880; border-radius:999px; padding:.05rem .5rem; margin-right:.25rem; }
    .acts { display:flex; flex-direction:column; align-items:flex-end; gap:.25rem; }
    .acts a { font-size:.75rem; color:#3a6fae; text-decoration:none; white-space:nowrap; }
    .acts input { width:18px; height:18px; accent-color:var(--deep); }
    .place.done .pname { text-decoration:line-through; color:var(--muted); }
    .opt { display:grid; grid-template-columns:1fr 1fr; gap:.4rem; margin:.35rem 0; }
    .opt div { background:#eef6ff; border-radius:10px; padding:.45rem .6rem; font-size:.82rem; }
    #map { height:100%; min-height:300px; }
    .leaflet-popup-content { font-family:"Zen Maru Gothic",system-ui,sans-serif; }
    .pin { width:28px; height:28px; border-radius:50% 50% 50% 0; transform:rotate(-45deg); display:grid; place-items:center; border:2px solid #fff; box-shadow:0 2px 6px rgba(0,0,0,.25); }
    .pin b { transform:rotate(45deg); color:#fff; font-size:.75rem; font-family:system-ui; }
    .progress { font-size:.8rem; color:var(--muted); padding:0 .8rem .5rem; }
    @media (max-width:820px){
      .app { grid-template-columns:1fr; grid-template-rows:42vh 1fr; }
      #mapwrap { order:-1; } aside { border-right:0; border-top:1px solid var(--line); }
    }
  </style>
</head>
<body>
<header>
  <a href="/">← garden</a>
  <h1>🌉 Bay Area: SJ + SF</h1>
  <span class="meta">Sat Oct 31 – Tue Nov 3, 2026 · base: Nam's (downtown San Jose)</span>
</header>
<div class="app">
  <aside>
    <div class="tabs" id="tabs"></div>
    <div class="search"><input id="q" placeholder="Search places… (e.g. dumplings, boba, museum)" /></div>
    <div class="progress" id="prog"></div>
    <div class="list" id="list"></div>
  </aside>
  <div id="mapwrap"><div id="map"></div></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const DAYS=[
 {id:"sat",label:"Sat 10/31",title:"Halloween · maybe drive up",color:"#f2a65a",
  notes:["Optional early start. If you drive up today, grab Chinese food on the way.","🎃 Halloween night idea: Winchester Mystery House Halloween tour (book early)."],
  places:[]},
 {id:"sun",label:"Sun 11/1",title:"Explore San Jose",color:"#4fbf96",
  opts:[["✈️ Fly","LGB → SJC, ~1h15m, arrive 11–12"],["🚗 Drive","Leave ~5 AM, arrive 11–12"]],
  notes:[],
  places:[
   {n:"San Jose Mineta Airport (SJC)",d:"Land ~11–12",ll:[37.3639,-121.9289],t:["travel"]},
   {n:"Winchester Mystery House",d:"Spooky mansion tour, ~1–1.5 hrs",ll:[37.3184,-121.9511],t:["attraction","spooky"]},
   {n:"Santana Row",d:"Shopping, boba & dessert across the street",ll:[37.3209,-121.9478],t:["walk","shopping"]},
   {n:"Hakone Gardens",d:"Japanese garden · in Saratoga (~25 min)",ll:[37.2486,-122.0436],t:["garden"]},
   {n:"Spina Farms Pumpkin Patch",d:"Pumpkin patch with dinosaurs · confirm open Nov 1",ll:[37.1913,-121.7292],t:["halloween"],warn:true},
   {n:"Daeho Kalbijjim",d:"Dinner: galbijjim · pick the nearest location",ll:null,t:["dinner","korean"]},
   {n:"Karaoke on El Camino Real",d:"Night out: noraebang + Korean BBQ area",ll:[37.3525,-121.9805],t:["night","activity"]},
  ]},
 {id:"mon",label:"Mon 11/2",title:"San Francisco day",color:"#e2729c",
  notes:["Many SF museums close on Mondays, so check hours for indoor stops."],
  places:[
   {n:"Stan's Donut Shop",d:"TikTok glazed donuts · in Santa Clara, grab on the way up",ll:[37.3474,-121.9727],t:["sweets"]},
   {n:"Kasamba Coffee",d:"Coffee",ll:null,t:["coffee"]},
   {n:"Dumpling Home",d:"Breakfast: soup dumplings (Michelin-recognized)",ll:[37.7744,-122.4235],t:["breakfast"]},
   {n:"Alamo Square · Painted Ladies",d:"Photo stop, short walk from breakfast",ll:[37.7764,-122.4346],t:["walk","photo"]},
   {n:"Blue Heron paddle boats · Stow Lake",d:"Golden Gate Park, really fun",ll:[37.7713,-122.4761],t:["activity"]},
   {n:"Japanese Tea Garden",d:"Next to Stow Lake",ll:[37.7701,-122.4703],t:["garden"]},
   {n:"Palace Games escape room",d:"Palace of Fine Arts · book ahead: palace-games.com",ll:[37.8029,-122.4484],t:["activity"],link:"https://palace-games.com/"},
   {n:"Crissy Field",d:"Best Golden Gate Bridge view (Wave Organ & Fort Point nearby)",ll:[37.8039,-122.4641],t:["walk","photo"]},
   {n:"Japan Center Malls",d:"Japantown shopping",ll:[37.7853,-122.4294],t:["shopping"]},
   {n:"Marufuku Ramen",d:"Dinner idea: tonkotsu ramen in Japantown",ll:[37.7852,-122.4313],t:["dinner"]},
   {n:"Golden Gate Bakery",d:"Chinatown egg tarts · hours vary",ll:[37.7964,-122.4073],t:["sweets"],warn:true},
   {n:"Golden Gate Fortune Cookie Factory",d:"Chinatown",ll:[37.7963,-122.4068],t:["sweets"]},
   {n:"Boudin Bakery",d:"Clam chowder bread bowl",ll:[37.8083,-122.4148],t:["food"]},
   {n:"Musée Mécanique",d:"Vintage arcade games for quarters",ll:[37.8094,-122.4160],t:["activity","quirky"]},
   {n:"PIER 39",d:"Sea lions & waterfront",ll:[37.8087,-122.4098],t:["attraction"]},
   {n:"Ghirardelli Square",d:"Sundae stop",ll:[37.8059,-122.4229],t:["sweets"]},
   {n:"Día de los Muertos · Mission",d:"Evening procession & altars (check this year's details)",ll:[37.7526,-122.4120],t:["event"]},
  ]},
 {id:"tue",label:"Tue 11/3",title:"Brunch & head home",color:"#ad98ea",
  opts:[["✈️ Fly","SJC → LGB, any time"],["🚗 Drive","Leave ~12 PM, home ~9 PM"]],
  notes:[],
  places:[
   {n:"New coffee spot next to Nam's",d:"Morning coffee",ll:null,t:["coffee"]},
   {n:"Dim sum brunch",d:"Kelly's pick",ll:null,t:["brunch"]},
   {n:"Rosicrucian Egyptian Museum + Rose Garden",d:"Optional before leaving: mummies & a free garden",ll:[37.3333,-121.9234],t:["museum"]},
  ]},
 {id:"ideas",label:"💡 Ideas",title:"Extra ideas",color:"#7aaee8",
  notes:["Not scheduled yet. Pick what you like."],
  places:[
   {n:"Bike the Golden Gate Bridge",d:"Rent e-bikes, ride to Sausalito, ferry back",ll:[37.8199,-122.4783],t:["activity"]},
   {n:"Alcatraz",d:"Book ASAP, usually sells out",ll:[37.8267,-122.4230],t:["attraction"]},
   {n:"Cable car (Powell-Hyde)",d:"Classic ride to Ghirardelli",ll:[37.7846,-122.4078],t:["activity"]},
   {n:"Lands End + Sutro Baths",d:"Ocean cliffs, ruins, sunset",ll:[37.7805,-122.5113],t:["walk"]},
   {n:"Hayes Valley",d:"Boutiques & coffee near Dumpling Home",ll:[37.7766,-122.4241],t:["walk"]},
   {n:"Haight-Ashbury",d:"Vintage shops & murals",ll:[37.7692,-122.4481],t:["walk"]},
   {n:"Good Mong Kok Bakery",d:"Takeout dim sum in Chinatown",ll:[37.7955,-122.4071],t:["food"]},
   {n:"La Taqueria",d:"Famous Mission burritos",ll:[37.7509,-122.4181],t:["food"]},
   {n:"House of Prime Rib",d:"Classic SF dinner, reserve ahead",ll:[37.7932,-122.4224],t:["dinner"]},
   {n:"Downtown Los Gatos",d:"Cute main street, ~20 min from SJ",ll:[37.2266,-121.9802],t:["walk"]},
   {n:"Apple Park Visitor Center",d:"Rooftop view of the 'spaceship'",ll:[37.3327,-122.0053],t:["tech"]},
   {n:"Castro St, Mountain View",d:"Boba & Asian food street",ll:[37.3937,-122.0790],t:["food","walk"]},
   {n:"Vietnamese breakfast · Story Rd",d:"SJ Little Saigon: pho, bánh mì, cà phê",ll:[37.3305,-121.8605],t:["breakfast"]},
   {n:"The Mystery Spot",d:"Gravity-defying spot, Santa Cruz (~40 min)",ll:[37.0170,-122.0024],t:["quirky"]},
   {n:"Sharks Ice San Jose",d:"Public ice skating",ll:[37.3097,-121.8719],t:["activity"]},
   {n:"San Pedro Square Market",d:"Downtown SJ food hall, close to Nam's",ll:[37.3364,-121.8941],t:["food"]},
  ]},
];
const ALL={id:"all",label:"All days",color:"#2d2a3e"};
let cur=localStorage.getItem("trip2_tab")||"all", query="";
const map=L.map("map",{zoomControl:true}).setView([37.55,-122.2],9);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(map);
let layer=L.layerGroup().addTo(map), markers={};
const key=(d,i)=>`trip2_${d}_${i}`;
const gmaps=n=>"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(n+" Bay Area CA");
function pin(color,num){return L.divIcon({className:"",html:`<div class="pin" style="background:${color}"><b>${num}</b></div>`,iconSize:[28,28],iconAnchor:[14,28],popupAnchor:[0,-26]});}
function tabs(){
  const el=document.getElementById("tabs"); el.innerHTML="";
  [ALL,...DAYS].forEach(d=>{const b=document.createElement("button");b.textContent=d.label;if(d.id===cur){b.className="on";b.style.background=d.color;}b.onclick=()=>{cur=d.id;localStorage.setItem("trip2_tab",cur);render();};el.appendChild(b);});
}
function render(){
  tabs(); layer.clearLayers(); markers={};
  const list=document.getElementById("list"); list.innerHTML="";
  const days=cur==="all"?DAYS.filter(d=>d.id!=="ideas"):DAYS.filter(d=>d.id===cur);
  const bounds=[]; let tot=0,done=0;
  days.forEach(d=>{
    const h=document.createElement("div"); h.className="dayhead"; h.innerHTML=`<span class="dot" style="background:${d.color}"></span><h2>${d.label}</h2><span>${d.title}</span>`; list.appendChild(h);
    (d.opts||[]).length && list.insertAdjacentHTML("beforeend",`<div class="opt">${d.opts.map(o=>`<div><b>${o[0]}</b><br>${o[1]}</div>`).join("")}</div>`);
    if(!query) d.notes.forEach(n=>list.insertAdjacentHTML("beforeend",`<div class="note">${n}</div>`));
    const route=[]; let num=0;
    d.places.forEach((p,i)=>{
      const txt=(p.n+" "+p.d+" "+p.t.join(" ")).toLowerCase(); if(query && !txt.includes(query)) return;
      tot++; const k=key(d.id,i), isDone=localStorage.getItem(k)==="1"; if(isDone) done++;
      const row=document.createElement("div"); row.className="place"+(isDone?" done":"");
      const label=p.ll?++num:"•";
      row.innerHTML=`<div class="num ${p.ll?"":"nomap"}" style="background:${d.color}">${label}</div>
        <div class="pbody"><div class="pname">${p.n}</div><div class="pdesc">${p.warn?"⚠️ ":""}${p.d}</div><div class="tags">${p.t.map(t=>`<span class="tag">${t}</span>`).join("")}</div></div>
        <div class="acts"><input type="checkbox" ${isDone?"checked":""} title="Done"><a href="${p.link||gmaps(p.n)}" target="_blank" rel="noopener">${p.link?"site ↗":"maps ↗"}</a></div>`;
      const cb=row.querySelector("input"); cb.onclick=e=>e.stopPropagation();
      cb.onchange=()=>{localStorage.setItem(k,cb.checked?"1":"0");render();};
      row.querySelector("a").onclick=e=>e.stopPropagation();
      if(p.ll){
        const m=L.marker(p.ll,{icon:pin(d.color,label)}).bindPopup(`<b>${p.n}</b><br>${p.d}<br><a href="${gmaps(p.n)}" target="_blank">Open in Google Maps ↗</a>`);
        m.addTo(layer); markers[k]=m; bounds.push(p.ll); route.push(p.ll);
        m.on("click",()=>{document.querySelectorAll(".place").forEach(x=>x.classList.remove("sel"));row.classList.add("sel");row.scrollIntoView({block:"nearest",behavior:"smooth"});});
        row.onclick=()=>{document.querySelectorAll(".place").forEach(x=>x.classList.remove("sel"));row.classList.add("sel");map.flyTo(p.ll,15,{duration:.8});m.openPopup();};
      }
      list.appendChild(row);
    });
    if(route.length>1 && d.id!=="ideas") L.polyline(route,{color:d.color,weight:3,opacity:.6,dashArray:"6 6"}).addTo(layer);
  });
  document.getElementById("prog").textContent=tot?`✔ ${done} of ${tot} done`:"No matches";
  if(bounds.length) map.fitBounds(bounds,{padding:[40,40],maxZoom:13});
  setTimeout(()=>map.invalidateSize(),50);
}
document.getElementById("q").oninput=e=>{query=e.target.value.trim().toLowerCase();render();};
render();
</script>
</body>
</html>
